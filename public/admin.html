<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - WORST FTP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            box-sizing: border-box;
        }
        header a {
            color: #ff00ff;
            text-decoration: none;
            font-weight: bold;
            margin-right: 20px;
            float: left;
            text-shadow: 0 0 5px #ff00ff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 40px;
            width: 90%;
            max-width: 600px;
            margin-bottom: 40px;
        }
        h2 { text-align: center; margin-top: 0; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #00ffcc; }
        input[type="text"], input[type="url"], select, textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-sizing: border-box;
            color: white;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        option { background: #203a43; color: white; }
        .help-text { font-size: 12px; color: #aaa; margin-top: 0; margin-bottom: 8px; }
        .or-divider { text-align: center; margin: 10px 0; color: #ff00ff; font-weight: bold; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff00ff, #00ffcc);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.4);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { margin-top: 20px; text-align: center; font-weight: bold; padding: 10px; border-radius: 5px; }
        .success { background: rgba(0, 255, 0, 0.2); color: #0f0; border: 1px solid #0f0; }
        .error { background: rgba(255, 0, 0, 0.2); color: #f00; border: 1px solid #f00; }

        .movie-list-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .movie-list-table th, .movie-list-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .movie-list-table th { color: #00ffcc; }
        .action-btn {
            padding: 5px 10px;
            margin: 0 5px;
            font-size: 14px;
            width: auto;
        }
        .btn-edit { background: linear-gradient(45deg, #f39c12, #e67e22); }
        .btn-delete { background: linear-gradient(45deg, #e74c3c, #c0392b); }
    </style>
</head>
<body>
    <header>
        <a href="/">&larr; Back to Home</a>
        WORST FTP Admin
    </header>

    <div class="container">
        <h2 id="formTitle">Upload a Movie</h2>
        <form id="uploadForm">
            <input type="hidden" id="movieId" name="movieId">

            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="genre">Genre:</label>
                <select id="genre" name="genre" required>
                    <option value="">Select a genre</option>
                    <option value="action">Action</option>
                    <option value="comedy">Comedy</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                    <option value="sci-fi">Sci-Fi</option>
                    <option value="thriller">Thriller</option>
                    <option value="documentary">Documentary</option>
                    <option value="anime">Anime</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quality">Quality:</label>
                <select id="quality" name="quality" required>
                    <option value="4K">4K</option>
                    <option value="1080p" selected>1080p</option>
                    <option value="720p">720p</option>
                    <option value="480p">480p</option>
                    <option value="CAM">CAM/TS</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="3"></textarea>
            </div>

            <div class="form-group" id="posterGroup">
                <label>Movie Poster (Image):</label>
                <p class="help-text">Provide either an image URL OR upload a file.</p>
                <input type="url" id="poster_url" name="poster_url" placeholder="Paste image link here (e.g. from Google Drive)">
                <div class="or-divider">OR</div>
                <input type="file" id="poster" name="poster" accept="image/*">
            </div>

            <div class="form-group" id="videoGroup">
                <label>Movie File (Video):</label>
                <p class="help-text">Provide either a video URL (Google Drive) OR upload a file.</p>
                <input type="url" id="video_url" name="video_url" placeholder="Paste Google Drive video link here">
                <div class="or-divider">OR</div>
                <input type="file" id="video" name="video" accept="video/*">
            </div>

            <button type="submit" id="submitBtn">Upload Movie</button>
            <button type="button" id="cancelBtn" style="display:none; margin-top: 10px; background: #555;">Cancel Edit</button>
        </form>
        <div id="status"></div>
    </div>

    <div class="container" style="max-width: 900px;">
        <h2>Manage Movies</h2>
        <div style="overflow-x: auto;">
            <table class="movie-list-table" id="movieTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Quality</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allMovies = [];

        async function loadMovies() {
            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();
                renderTable();
            } catch (err) {
                console.error('Failed to load movies', err);
            }
        }

        function renderTable() {
            const tbody = document.querySelector('#movieTable tbody');
            tbody.innerHTML = '';

            allMovies.forEach(movie => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${movie.title}</td>
                    <td style="text-transform: capitalize;">${movie.genre}</td>
                    <td>${movie.quality || '1080p'}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editMovie(${movie.id})">Edit</button>
                        <button class="action-btn btn-delete" onclick="deleteMovie(${movie.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editMovie(id) {
            const movie = allMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('formTitle').textContent = 'Edit Movie Details';
            document.getElementById('submitBtn').textContent = 'Save Changes';
            document.getElementById('cancelBtn').style.display = 'block';

            document.getElementById('movieId').value = movie.id;
            document.getElementById('title').value = movie.title;
            document.getElementById('genre').value = movie.genre;
            document.getElementById('quality').value = movie.quality || '1080p';
            document.getElementById('description').value = movie.description;

            // Hide file/url inputs during edit to simplify logic (they only edit text metadata)
            document.getElementById('posterGroup').style.display = 'none';
            document.getElementById('videoGroup').style.display = 'none';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        function resetForm() {
            document.getElementById('uploadForm').reset();
            document.getElementById('formTitle').textContent = 'Upload a Movie';
            document.getElementById('submitBtn').textContent = 'Upload Movie';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('movieId').value = '';

            document.getElementById('posterGroup').style.display = 'block';
            document.getElementById('videoGroup').style.display = 'block';
            document.getElementById('status').className = '';
            document.getElementById('status').textContent = '';
        }

        async function deleteMovie(id) {
            if (!confirm('Are you sure you want to delete this movie?')) return;

            try {
                const response = await fetch(`/api/movies/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Movie deleted successfully');
                    loadMovies();
                } else {
                    alert('Failed to delete movie');
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting movie');
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const isEdit = document.getElementById('movieId').value !== '';
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            statusDiv.textContent = 'Processing... Please wait.';
            statusDiv.className = '';
            submitBtn.disabled = true;

            try {
                let response;

                if (isEdit) {
                    const id = document.getElementById('movieId').value;
                    const data = {
                        title: document.getElementById('title').value,
                        genre: document.getElementById('genre').value,
                        quality: document.getElementById('quality').value,
                        description: document.getElementById('description').value
                    };

                    response = await fetch(`/api/movies/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    // New Upload Validation
                    const videoFile = document.getElementById('video').files.length > 0;
                    const videoUrl = document.getElementById('video_url').value.trim() !== '';
                    const posterFile = document.getElementById('poster').files.length > 0;
                    const posterUrl = document.getElementById('poster_url').value.trim() !== '';

                    if (!videoFile && !videoUrl) {
                        alert('Please provide either a Video File or a Video URL.');
                        submitBtn.disabled = false;
                        statusDiv.textContent = '';
                        return;
                    }
                    if (!posterFile && !posterUrl) {
                        alert('Please provide either a Poster File or a Poster URL.');
                        submitBtn.disabled = false;
                        statusDiv.textContent = '';
                        return;
                    }

                    const formData = new FormData(form);
                    response = await fetch('/api/movies', {
                        method: 'POST',
                        body: formData
                    });
                }

                const result = await response.json();

                if (response.ok) {
                    statusDiv.textContent = isEdit ? 'Movie updated successfully!' : 'Movie uploaded successfully!';
                    statusDiv.className = 'success';
                    resetForm();
                    loadMovies();
                } else {
                    throw new Error(result.error || 'Operation failed');
                }
            } catch (error) {
                statusDiv.textContent = 'Error: ' + error.message;
                statusDiv.className = 'error';
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Load movies on init
        loadMovies();
    </script>
</body>
</html>
